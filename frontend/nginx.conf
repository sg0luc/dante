# =============================================================================
# Nginx do frontend: serve a SPA e faz proxy de /api para o backend.
#
# IMPORTANTE: os cabeçalhos de segurança ficam no nível "server" e NENHUM
# "location" usa add_header — no Nginx, um add_header dentro de location
# cancela a herança de todos os add_header do nível superior.
# =============================================================================
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    # --- Cabeçalhos de segurança --------------------------------------------
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # --- API -> backend -----------------------------------------------------
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Sobrescreve (não concatena) para impedir IP forjado pelo cliente.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # --- Assets com hash no nome: cache longo -------------------------------
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # --- SPA: rotas do React caem no index.html (sem cache) -----------------
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}

